<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="workbench-favicon" rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <script>
      (function () {
        var stored = localStorage.getItem("vueuse-color-scheme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var link = document.getElementById("workbench-favicon");
        if (link) link.href = dark ? "/favicon-dark.svg" : "/favicon-light.svg";
      })();
    </script>
    <title>workbench</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
