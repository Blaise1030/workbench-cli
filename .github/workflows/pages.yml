name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "landing/**"
      - "docs/install.sh"
      - "docs/latest.json"
      - "docs/dev-versions.json"
      - "scripts/generate-latest-json.mjs"
      - "scripts/prepare-versioned-install.mjs"
      - "scripts/merge-versioned-installs.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
