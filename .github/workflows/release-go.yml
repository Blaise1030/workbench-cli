name: Release

# Stable release pipeline:
#   1. Release Please merges a release PR → creates tag (v* from now on; workbench-v* legacy).
#   2. This workflow builds Go binaries and uploads them to that GitHub Release.
#   3. deploy-cloudflare refreshes latest.json on Cloudflare so `curl | sh` installs that version.
on:
  push:
    tags:
      - "v*"
      - "workbench-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: tag that triggered the run)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            name: workbench-cli-linux-x86_64
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            name: workbench-cli-linux-aarch64
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            name: workbench-cli-macos-x86_64
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            name: workbench-cli-macos-aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          REF="${GITHUB_REF_NAME}"
          TAG_VERSION="${REF#v}"
          TAG_VERSION="${TAG_VERSION#workbench-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $REF does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server-go/go.mod
          cache-dependency-path: apps/server-go/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Stage UI for go:embed
        run: |
          rm -rf apps/server-go/internal/assets/public
          mkdir -p apps/server-go/internal/assets/public
          cp -R dist/public/. apps/server-go/internal/assets/public/
          test -f apps/server-go/internal/assets/public/index.html

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cd apps/server-go
          go build \
            -tags embed \
            -ldflags="-s -w -X github.com/blaisetiong/workbench-cli/server-go/internal/server.version=${PKG_VERSION}" \
            -o "../../dist/${{ matrix.name }}" \
            ./cmd/workbench-cli

      - name: Package tarball
        run: |
          chmod +x "dist/${{ matrix.name }}"
          cd dist
          tar czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz

  release:
    name: Upload binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "release_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "error: workflow_dispatch requires inputs.tag (e.g. workbench-v0.2.0)" >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloudflare:
    name: Refresh install manifest on Cloudflare
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
