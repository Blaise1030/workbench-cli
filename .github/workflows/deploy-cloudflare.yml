# Reusable Cloudflare deploy for the landing page + install manifest.
# Called from release-go.yml after binaries are uploaded to a GitHub Release.
name: Deploy to Cloudflare (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Git tag for the install manifest (e.g. v0.4.3). Passed as PUBLIC_RELEASE_TAG."
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter apps-landing-page...

      - name: Build landing page
        env:
          PUBLIC_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm --filter apps-landing-page run build

      - name: Deploy to Cloudflare
        working-directory: apps/landing-page
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
